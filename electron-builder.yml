appId: com.voucherredeem.app
productName: Voucher Redeem
copyright: Voucher Redeem
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
asar: true
extraResources:
  - from: migrations
    to: migrations
  - from: assets/fonts
    to: fonts
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target: [dmg]
  category: public.app-category.business
